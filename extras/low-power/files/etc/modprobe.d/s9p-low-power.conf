# Galaxy S9+ idle power (extras/low-power)
# memory clock range in kHz (421000..1794000); floor while the USB-C monitor runs
options s9p_mif min_khz=421000 max_khz=1794000 display_khz=676000
# PMU domains to switch off (all of them: isplp,isphq,isppre,dsps,dspm,dcrd,dcpost,dcf,g2d,iva,mfc)
options s9p_pd_off domains=isplp,isphq,isppre,dsps,dspm,dcrd,dcpost,dcf,g2d,iva,mfc
