<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  s9p-mobile offers the modem to NetworkManager and GNOME through
  ModemManager's D-Bus API, under ModemManager's name (ModemManager itself
  cannot drive Samsung's RIL). Anyone may read it, as with ModemManager;
  s9p-mobile itself only lets root connect, disconnect or switch it off.
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>
  <policy context="default">
    <deny own="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>
</busconfig>
