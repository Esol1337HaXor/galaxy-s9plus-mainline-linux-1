SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='HPOUT2L Input 1' AIF1RX1"
		cset "name='HPOUT2R Input 1' AIF1RX2"
		cset "name='HPOUT2 Digital Switch' on,on"
	]
	DisableSequence [
		cset "name='HPOUT2 Digital Switch' off,off"
		cset "name='HPOUT2L Input 1' None"
		cset "name='HPOUT2R Input 1' None"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "HPOUT2 Digital"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	EnableSequence [
		cset "name='Left Amp Switch' on"
		cset "name='Right Amp Switch' on"
	]
	DisableSequence [
		cset "name='Left Amp Switch' off"
		cset "name='Right Amp Switch' off"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "Left Digital"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"
	EnableSequence [
		cset "name='AIF1TX1 Input 1' IN3L"
		cset "name='AIF1TX2 Input 1' IN3R"
		cset "name='IN3L HPF Switch' on"
		cset "name='IN3R HPF Switch' on"
	]
	DisableSequence [
		cset "name='AIF1TX1 Input 1' None"
		cset "name='AIF1TX2 Input 1' None"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "IN3L Digital"
	}
}
