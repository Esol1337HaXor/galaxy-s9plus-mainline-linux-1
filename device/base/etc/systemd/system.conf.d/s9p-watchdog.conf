[Manager]
# Hardware watchdog (cluster 1 WDT): reset if the kernel or systemd stops
# answering. The kernel keeps it fed until systemd takes over here.
RuntimeWatchdogSec=30s
# Armed through shutdown, so a reboot that hangs still resets the phone.
# Must stay below the WDT's max_timeout (82 s): systemd-shutdown cannot
# program a longer one and the reset would not be armed.
RebootWatchdogSec=60s
